name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  REGION: asia-northeast1
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  IMAGE_BASE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tamado

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install backend dependencies
        run: pnpm install --filter=backend --frozen-lockfile

      - name: Run database migrations
        run: |
          DATABASE_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL --project=${{ env.PROJECT_ID }})
          cd apps/backend && DATABASE_URL=$DATABASE_URL pnpm exec prisma migrate deploy

      - name: Build backend image
        run: |
          docker build -f apps/backend/Dockerfile.prod \
            -t ${{ env.IMAGE_BASE }}/backend:${{ github.sha }} \
            -t ${{ env.IMAGE_BASE }}/backend:latest \
            .

      - name: Push backend image
        run: |
          docker push ${{ env.IMAGE_BASE }}/backend:${{ github.sha }}
          docker push ${{ env.IMAGE_BASE }}/backend:latest

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy tamado-backend \
            --image ${{ env.IMAGE_BASE }}/backend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account tamado-backend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --set-secrets DATABASE_URL=DATABASE_URL:latest \
            --set-env-vars NODE_ENV=production,FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --port 3000

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build frontend image
        run: |
          docker build -f apps/frontend/Dockerfile.prod \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }} \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }} \
            --build-arg VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }} \
            -t ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }} \
            -t ${{ env.IMAGE_BASE }}/frontend:latest \
            .

      - name: Push frontend image
        run: |
          docker push ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }}
          docker push ${{ env.IMAGE_BASE }}/frontend:latest

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy tamado-frontend \
            --image ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account tamado-frontend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --port 8080
